name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same shape as .env.example, pointing at the service container below.
  DATABASE_URL: postgresql://animalesko:animalesko@localhost:5432/animalesko_dev?schema=public
  DIRECT_DATABASE_URL: postgresql://animalesko:animalesko@localhost:5432/animalesko_dev?schema=public
  TEST_DATABASE_URL: postgresql://animalesko:animalesko@localhost:5432/animalesko_test?schema=public
  BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_PLUS_URL: http://localhost:3001

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: animalesko
          POSTGRES_PASSWORD: animalesko
          POSTGRES_DB: animalesko_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animalesko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The compose init script isn't available to a service container, so the
      # test database is created here instead.
      - name: Create test database
        run: |
          PGPASSWORD=animalesko psql -h localhost -U animalesko -d animalesko_dev \
            -c 'CREATE DATABASE animalesko_test OWNER animalesko;'

      # Everything downstream needs the generated client. The *test* database is
      # migrated by the integration suite's own setup file, so there is no
      # `migrate dev` here — that command is interactive on drift and would hang.
      - run: pnpm db:generate

      - run: pnpm typecheck
      - run: pnpm lint

      # apps/app and apps/mobile are two hosts over the same screens, and
      # neither fails to build when the other is missing a page — so route
      # drift is only ever found by opening the app. This is cheap and catches
      # it at the pull request.
      - run: pnpm check:routes

      - run: pnpm test
      - run: pnpm test:integration

      # apps/mobile refuses to build without NEXT_PUBLIC_API_URL: it is inlined
      # into the bundle at build time and decides which server the shipped app
      # talks to, so a build that silently defaulted would produce an app
      # pointing at nothing. CI only needs to prove the bundle compiles, and the
      # value never leaves the runner — release builds set it explicitly through
      # apps/mobile/scripts/mobile.sh.
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://app.animalesko.org

  # Applies pending migrations to the Neon production database.
  #
  # A job here rather than a separate workflow so it can depend on `verify`:
  # the property that matters is that nothing reaches production unless the
  # whole suite passed. A workflow triggered on `push: main` would race CI and
  # could migrate a commit whose tests are failing.
  migrate:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Scopes the connection string to this one job and records a deployment.
    # A required reviewer can be added in repo settings without touching this
    # file.
    environment: production

    # Overrides the workflow-level group, which cancels in progress. That is
    # right for CI and wrong here: interrupting `migrate deploy` can leave a
    # half-applied migration and a held advisory lock. Two rapid merges queue.
    concurrency:
      group: migrate-production
      cancel-in-progress: false

    env:
      # Overrides the workflow-level value pointing at the CI service
      # container — job-level env wins. Must be Neon's *unpooled* host (no
      # `-pooler`): Prisma Migrate takes a session-level advisory lock, and
      # PgBouncer in transaction mode does not preserve session state, so the
      # pooled endpoint hangs instead of failing cleanly.
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Records what was outstanding before anything is applied — the line you
      # want in the log when a deploy goes wrong. Never fails the job.
      - name: Show pending migrations
        continue-on-error: true
        run: pnpm --filter @animalesko/db exec prisma migrate status

      # The same command a human would run as a release step, so there is one
      # path rather than two. Deliberately no `db:generate` (migrations do not
      # need the client) and never `db:seed` — the seed writes demo accounts
      # with a known password.
      - run: pnpm db:deploy
