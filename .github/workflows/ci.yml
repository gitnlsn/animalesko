name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same shape as .env.example, pointing at the service container below.
  DATABASE_URL: postgresql://animalesko:animalesko@localhost:5432/animalesko_dev?schema=public
  DIRECT_DATABASE_URL: postgresql://animalesko:animalesko@localhost:5432/animalesko_dev?schema=public
  TEST_DATABASE_URL: postgresql://animalesko:animalesko@localhost:5432/animalesko_test?schema=public
  BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_PLUS_URL: http://localhost:3001

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: animalesko
          POSTGRES_PASSWORD: animalesko
          POSTGRES_DB: animalesko_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animalesko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The compose init script isn't available to a service container, so the
      # test database is created here instead.
      - name: Create test database
        run: |
          PGPASSWORD=animalesko psql -h localhost -U animalesko -d animalesko_dev \
            -c 'CREATE DATABASE animalesko_test OWNER animalesko;'

      # Everything downstream needs the generated client. The *test* database is
      # migrated by the integration suite's own setup file, so there is no
      # `migrate dev` here — that command is interactive on drift and would hang.
      - run: pnpm db:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
